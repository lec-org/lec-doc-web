name: Community guard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/lec-doc-web
      - uses: actions/checkout@v4
        with:
          repository: lec-org/lec-doc-editor
          ref: 9c08bd2f7194f7a59b0b0db28cae9ddd5b766a24
          path: packages/lec-doc-editor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: node packages/lec-doc-editor/scripts/community-guard.mjs apps/lec-doc-web
      - run: pnpm --dir packages/lec-doc-editor install --frozen-lockfile && pnpm --dir packages/lec-doc-editor build
      - run: pnpm --dir apps/lec-doc-web install --frozen-lockfile
      - run: pnpm --dir apps/lec-doc-web build && pnpm --dir apps/lec-doc-web test && pnpm --dir apps/lec-doc-web lint
      - run: pnpm --dir apps/lec-doc-web check:community
